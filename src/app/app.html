<header class="site-header">
  <div class="header-content">
    <p class="brand">Gadget Wiz</p>
    <h1>Everyday essentials, thoughtfully chosen.</h1>
  </div>
</header>
<main class="page">
  <header class="page-header">
    <h1>My Products</h1>
    <p>Browse our latest products</p>
  </header>

  @if (message()) {
    <p class="status-message">
      {{ message() }}
    </p>
  }

  @if (products.length > 0) {
    <section class="product-grid" >
      @for (p of products; track p.id) {
        <app-product-card
          [name]="p.name"
          [price]="p.price"
          [image]="p.image"
          (addToCart)="onProductAdded($event)"
        /> 
      } <!-- selector defined in child component. -->
    </section>
  } @else {
    <p class="empty-message">No products available.</p>
  }
</main>
